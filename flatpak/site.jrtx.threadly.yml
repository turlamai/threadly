# Flatpak bundle manifest for the release payload (issue: the Linux
# distribution contract — deb+rpm+AppImage+Flatpak+tar.gz).
#
# CI renders the __VERSION__ / __ARCH__ / __SHA256__ placeholders from the
# linux tar.gz it just built and writes the generated manifest to the repo
# root (see .github/workflows/release.yml, the Linux job's Flatpak bundle
# step):
#
#   sed -e "s/__VERSION__/.../" -e "s/__ARCH__/.../" -e "s/__SHA256__/.../" \
#     flatpak/site.jrtx.threadly.yml > site.jrtx.threadly.gen.yml
#   flatpak-builder --user --force-clean --repo=repo build-dir \
#     site.jrtx.threadly.gen.yml
#   flatpak build-bundle repo threadly-<v>-linux-<arch>.flatpak \
#     site.jrtx.threadly stable
#
# The payload is self-contained (embedded Racket CS runtime, res/, racket/).
# readelf on the release binary shows exactly two NEEDED entries outside
# the GNOME Platform runtime — liblz4.so.1 and libtinfo.so.6 — provided by
# the two small modules below (the same closure as every family product;
# WebKitGTK/JavaScriptCore for the post renderer ship in the runtime).
app-id: site.jrtx.threadly
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: RivetHost
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # prefer_xwayland_backend() picks X11 exactly when DISPLAY is set and
  # WAYLAND_DISPLAY is not; granting only the X11 socket keeps that
  # decision deterministic.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # The product is a forum client: the backend talks to the configured
  # Discourse instance over its JSON API, calls the user-configured
  # OpenAI-compatible AI endpoint (racket/ai.rkt), and checks/downloads
  # updates against GitHub Releases (SECURITY.md "Design notes"). No
  # network, no Threadly.
  - --share=network
  # No filesystem grants: forum cache, auth and updater state live under
  # the data dir (racket/core/paths.rkt — Racket's cache-dir), which resolves
  # to XDG_CACHE_HOME and is redirected into the app's sandboxed home;
  # nothing else on disk is read or written.
modules:
  - name: lz4
    # Upstream keeps meson under build/ (flatpak-builder needs it at the
    # module root), so use the primary Makefile build — library only.
    buildsystem: simple
    build-commands:
      - make lib-release PREFIX=/app
      - make -C lib install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/lz4/lz4.git
        tag: v1.9.4
        commit: 5ff839680134437dbf4678f3d0c7b371d84f4964
  - name: ncurses
    # libtinfo.so.6 only (the payload's NEEDED entry); no programs, no
    # terminfo database install — the host system's entries stay put.
    config-opts:
      - --prefix=/app
      - --with-shared
      - --with-termlib
      - --without-progs
      - --without-tack
      - --without-tests
      # We only need libtinfo; the C++ binding does not survive the
      # GNOME 50 SDK's GCC 15 libstdc++ (cstddef redefinition).
      - --without-cxx-binding
      - --without-cxx
      - --disable-db-install
    sources:
      - type: archive
        url: https://ftp.gnu.org/pub/gnu/ncurses/ncurses-6.5.tar.gz
        sha256: 136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6
  - name: threadly
    buildsystem: simple
    sources:
      - type: archive
        path: threadly-__VERSION__-linux-__ARCH__.tar.gz
        sha256: __SHA256__
      - type: file
        path: assets/icon_512.png
      - type: file
        path: flatpak/site.jrtx.threadly.desktop
    build-commands:
      # flatpak-builder strips the archive's leading directory: the payload
      # (RivetHost, runtime/, res/, racket/) lands flat in the build dir.
      - mkdir -p /app/threadly
      - cp -a RivetHost runtime res racket /app/threadly/
      # The bundle's `command` resolves on the sandbox PATH (/app/bin); the
      # payload lives outside it. A symlink keeps /proc/self/exe pointing
      # at the real binary so the runtime layout discovery works.
      - mkdir -p /app/bin
      - ln -s /app/threadly/RivetHost /app/bin/RivetHost
      - install -Dm644 icon_512.png
                    /app/share/icons/hicolor/512x512/apps/site.jrtx.threadly.png
      - install -Dm644 site.jrtx.threadly.desktop
                    /app/share/applications/site.jrtx.threadly.desktop
