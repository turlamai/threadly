name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single source of truth for the rivet pin (same value as ci.yml); every
  # install step below references this so a bump is one edit. This pin sits
  # past v0.14.0, the first rivet release containing the branded installer
  # experience this pin was cut for: dmg-background layout, WiX wizard
  # bitmaps, deb desktop refresh.
  RIVET_PIN: c2e3760c504677cffe77c06bf30744572992cbf2

jobs:
  # Taskly-pattern preflight: prove the signing key matches both embedded
  # updater trust roots before any platform build burns a runner. The
  # publish job re-checks the secret as a second line of defense.
  signing-preflight:
    name: Verify update signing key before platform builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet (the signer)
        run: |
          set -euo pipefail
          git clone https://github.com/turlamai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout "$RIVET_PIN"
          raco pkg install --auto --no-docs --name rivet --link "$RUNNER_TEMP/rivet"
      - name: Sign a stub manifest with the release key
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY is required before release packaging"
            exit 1
          fi
          # make-update-manifest.sh refuses a key that does not match the
          # embedded Racket and macOS trust roots, and the signer validates
          # the manifest schema — exercising it here fails the release
          # before packaging starts. (scripts/test-release-signing.sh
          # covers the negative case offline.)
          TMP="$(mktemp -d)"
          KEY_PEM="$(mktemp)"
          trap 'rm -rf "$TMP" "$KEY_PEM"' EXIT
          chmod 600 "$KEY_PEM"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for name in macos-arm64.zip macos-x64.zip windows-x64.zip linux-x64.tar.gz; do
            # the manifest schema requires a positive payload size, so the
            # stubs carry a marker line rather than being empty
            printf 'threadly signing preflight stub\n' > "$TMP/threadly-$VERSION-$name"
          done
          bash scripts/make-update-manifest.sh "v$VERSION" "$TMP" "$KEY_PEM" > /dev/null
          test -s "$TMP/update-manifest.json"

  macos:
    needs: [signing-preflight]
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    env:
      # Production signing lights up as soon as the account-level secrets
      # exist (Developer ID p12 + App Store Connect API key) and applies to
      # every workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see rivet docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet
        run: |
          set -euo pipefail
          git clone https://github.com/turlamai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout "$RIVET_PIN"
          raco pkg install --auto --no-docs --name rivet --link "$RUNNER_TEMP/rivet"
      - name: Version preflight (VERSION == rivet.rktd == racket/version.rkt == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          # rivet reads exactly these two (rivet docs/production-signing.md);
          # release defaults to production mode, so exporting them alone
          # flips packaging over once --development is dropped below.
          {
            echo "RIVET_MACOS_SIGN_IDENTITY=$IDENTITY_NAME"
            echo "RIVET_MACOS_NOTARY_PROFILE=ASC_NOTARY"
          } >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      # DMG (human installer) + portable zip + SBOM + notices, launch
      # smoke included. The macOS update feed entry is the portable zip,
      # assembled by scripts/make-update-manifest.sh in the publish job.
      # `raco rivet release` defaults to production packaging: with the
      # credentials exported above it Developer ID-signs, notarizes,
      # staples, and re-verifies inside rivet itself.
      - name: Release (DMG + portable zip, Developer ID + notarized)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: raco rivet release --without-updates
      - name: Release (DMG + portable zip, ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        run: raco rivet release --without-updates --development
      - name: Release requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          # rivet names the portable zip in family form already; only the
          # DMG lacks the architecture.
          mv "threadly-${VERSION}-macos.dmg" "threadly-${VERSION}-macos-${ARCH}.dmg"
          for f in threadly-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/notices/wixpdb bodies stay in the CI artifact only;
              # a sidecar without its body on the release is a dangling
              # reference. Checksum what we upload.
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/threadly-*

  windows:
    needs: [signing-preflight]
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet
        shell: pwsh
        run: |
          git clone https://github.com/turlamai/rivet.git "$env:RUNNER_TEMP\rivet"
          git -C "$env:RUNNER_TEMP\rivet" checkout $env:RIVET_PIN
          raco pkg install --auto --no-docs --name rivet --link "$env:RUNNER_TEMP\rivet"
      - name: Install WiX (v5; rivet's MSI toolchain)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Install crypto (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: pwsh
      - name: Version preflight (VERSION == rivet.rktd == racket/version.rkt == tag)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          for f in threadly-*; do
            case "$f" in
              *.sha256) ;;
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/threadly-*

  linux:
    needs: [signing-preflight]
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04, not ubuntu-latest: the 26.04 image's rpm 4.20+
          # changed the BUILDROOT layout and %files glob semantics, which
          # breaks rivet's create-rpm! (v0.15.0's first tag run failed
          # there; the arm64 leg pins 24.04 and builds the same spec
          # fine). Revisit when rivet's rpm path is 4.20-clean.
          - { arch: x64, runner: ubuntu-24.04, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      # GitHub does not allow expressions in `uses:`, so this action pin
      # stays literal — keep it in sync with RIVET_PIN above.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@c2e3760c504677cffe77c06bf30744572992cbf2
      # The source-built minimal runtime ships without the packages that
      # provide `raco make` (compiler-lib) and `raco ctool` (cext-lib),
      # which `raco rivet build` drives; crypto is a rivet/distribution
      # dependency. Threadly's backend itself needs nothing beyond base.
      - name: Install raco commands + crypto into the embeddable runtime
        run: raco pkg install --auto --no-docs compiler-lib cext-lib crypto
      - name: Install pinned Rivet
        run: |
          set -euo pipefail
          git clone https://github.com/turlamai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout "$RIVET_PIN"
          raco pkg install --auto --no-docs --name rivet --link "$RUNNER_TEMP/rivet"
      - name: Install GTK4, WebKitGTK, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsecret-1-dev \
            libglib2.0-dev libwebkitgtk-6.0-dev \
            cmake ninja-build pkg-config file \
            rpm desktop-file-utils
      - name: Version preflight (VERSION == rivet.rktd == racket/version.rkt == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # tar.gz (the update-feed payload) + deb + rpm + AppImage + portable
      # zip + SBOM, launch smoke included. The AppImage carries its own
      # GTK4/WebKitGTK dependency closure; APPIMAGE_EXTRACT_AND_RUN lets
      # appimagetool run on the runner.
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      # Wraps the tar.gz payload into a Flatpak bundle from the flatpak/
      # manifest template (family contract: deb+rpm+AppImage+Flatpak+tar.gz).
      # The manifest's module closure covers the two NEEDED entries outside
      # the GNOME Platform runtime (liblz4.so.1, libtinfo.so.6). Like deb/rpm,
      # the flatpak install shape is manual-by-design and stays out of the
      # signed update feed. Runs before Family naming so the bundle joins
      # the checksum sweep.
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc covers the
          # ubuntu-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/threadly-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "threadly-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.threadly.yml > site.jrtx.threadly.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.threadly.gen.yml
          flatpak build-bundle flatpak-repo \
            "threadly-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.threadly stable
          mv "threadly-${VERSION}-linux-${ARCH}.flatpak" dist/
          rm -rf flatpak-build flatpak-repo \
            "threadly-${VERSION}-linux-${ARCH}.tar.gz" site.jrtx.threadly.gen.yml
          test -f "dist/threadly-${VERSION}-linux-${ARCH}.flatpak"
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          mv sbom.cdx.json "threadly-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "threadly-${VERSION}-linux-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in threadly-*; do
            case "$f" in
              *.sha256) ;;
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/threadly-*

  publish:
    name: Publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet
        run: |
          set -euo pipefail
          git clone https://github.com/turlamai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout "$RIVET_PIN"
          raco pkg install --auto --no-docs --name rivet --link "$RUNNER_TEMP/rivet"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather + sign the update feed + publish
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv artifacts/macos-arm64/* artifacts/macos-x64/* artifacts/windows/* \
             artifacts/linux-x64/* artifacts/linux-arm64/* dist/
          # The portable zips (macOS/Windows) and the tar.gz (Linux) are the
          # update feed, assembled and signed by make-update-manifest.sh.
          # The updater trusts only Ed25519-signed manifests. Never create
          # even a draft release whose feed cannot be verified by clients.
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY is required; refusing to publish without a signed update manifest"
            exit 1
          fi
          umask 077
          KEY_PEM="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          bash scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_PEM"
          test -s dist/update-manifest.json || {
            echo "::error::Signed update-manifest.json was not generated"
            exit 1
          }
          rm -f "$KEY_PEM"
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          cat >> /tmp/notes.md <<'SIGNING_STATUS'

          ### Package signing and updates
          - macOS: ad-hoc development signing only. These packages are **not** Developer ID signed or Apple notarized; Gatekeeper may warn.
          - Windows: MSI and portable ZIP are unsigned. Windows SmartScreen may warn; Authenticode is not configured.
          - Linux: native packages require no paid publisher account.
          - In-app update metadata is Ed25519 signed; clients must verify the signature and downloaded payload digest.
          SIGNING_STATUS
          # Preserve the draft-only acceptance gate, but curate the exact
          # public set before it is eligible for manual promotion.
          (cd dist && cat *.sha256 | sed 's/ \*/  /' | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-arm64.tar.gz linux-arm64.zip linux-x64.tar.gz linux-x64.zip \
            linux-amd64.deb linux-arm64.deb \
            linux-aarch64.AppImage linux-x86_64.AppImage \
            linux-arm64.flatpak linux-x64.flatpak; do
            name="threadly-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing $name"; exit 1; }
            cp "dist/$name" public/
          done
          for arch in aarch64 x86_64; do
            rpm="$(find dist -maxdepth 1 -type f -name "threadly-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing $arch RPM"; exit 1; }
            cp "$rpm" public/
          done
          cp dist/SHA256SUMS dist/update-manifest.json public/
          test -s public/update-manifest.json
          # 14 installers/archives + 2 RPMs + 2 Flatpak bundles.
          test "$(find public -maxdepth 1 -type f -name 'threadly-*' | wc -l)" -eq 18
          (cd public && sha256sum -c SHA256SUMS)
          test -s /tmp/notes.md
          # Draft only; manual acceptance controls promotion to Latest.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Threadly $VERSION" \
            --notes-file /tmp/notes.md \
            public/*
      - name: Attest public artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
