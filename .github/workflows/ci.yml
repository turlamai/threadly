name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single source of truth for the rivet pin (same value as release.yml);
  # every rivet checkout below references this so a bump is one edit.
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == app/version.rkt)
        run: bash scripts/check-release-version.sh
        shell: bash
      - name: Reject an untrusted release signing key (offline)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/test-release-signing.sh
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Checkout Rivet (sibling)
        uses: actions/checkout@v4
        with:
          repository: turlamai/rivet
          ref: ${{ env.RIVET_PIN }}
          path: rivet
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
        shell: bash
      # rivet/distribution (the update engine) and the tests' crypto
      # factories need the crypto package; --auto pulls it for the rivet
      # link, this keeps the direct dependency explicit.
      - name: Install crypto (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Compile backend
        run: raco make app/core/*.rkt app/backend.rkt app/cli.rkt
        shell: bash
      - name: Run tests
        run: raco test tests/
        shell: bash
      - name: CLI smoke (offline commands only)
        shell: bash
        env:
          THREADLY_DATA_DIR: ${{ runner.temp }}/threadly-cli-smoke
        run: |
          racket app/cli.rkt version
          racket app/cli.rkt doctor
          racket app/cli.rkt bad-command 2>/dev/null && exit 1 || test $? -eq 2

  macos-host:
    name: macOS host build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet (sibling)
        uses: actions/checkout@v4
        with:
          repository: turlamai/rivet
          ref: ${{ env.RIVET_PIN }}
          path: rivet
      - name: Install Racket (CS, arm64)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: arm64
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
      - name: Build + package + verify
        run: raco rivet package
      - name: Store contract fixtures (delayed-response, issue #2)
        env:
          RIVET_ROOT: ${{ github.workspace }}/rivet
          RIVET_RACKET_FRAMEWORK_DIR: ${{ github.workspace }}/.rivet/stage/Frameworks
        run: |
          # Rivet's own runtime discovery, same source `raco rivet build`
          # uses for its -Xcc include path.
          racket_include="$(raco rivet doctor --json | jq -r '.runtime["include-dir"]')"
          swift test --package-path macos-host --scratch-path .rivet/build/macos \
            -Xcc "-I${racket_include}"
      - name: Launch smoke (ad-hoc build)
        run: |
          open dist/threadly.app
          sleep 10
          pgrep -f "threadly.app" >/dev/null || { echo "::error::app did not stay running"; exit 1; }
          pkill -f "threadly.app" || true

  linux-host:
    name: Linux host (GTK4 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet (sibling)
        uses: actions/checkout@v4
        with:
          repository: turlamai/rivet
          ref: ${{ env.RIVET_PIN }}
          path: rivet
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev \
            libsecret-1-dev libglib2.0-dev libwebkitgtk-6.0-dev \
            libncurses-dev zlib1g-dev liblz4-dev
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
      # Builds and caches the embeddable Racket CS runtime and exports
      # RIVET_RACKET_* for the CMake host build.
      - name: Set up embeddable Racket CS
        uses: ./rivet/.github/actions/setup-embed-racket
      # The source-built minimal runtime ships without the packages that
      # provide `raco make` (compiler-lib) and `raco ctool` (cext-lib), which
      # `raco rivet build` drives to compile the backend.
      - name: Install raco commands into the embeddable runtime
        run: raco pkg install --auto --no-docs compiler-lib cext-lib
      - name: Build host
        run: raco rivet build
      - name: Headless boot smoke
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ./.rivet/stage/RivetHost &
          APP_PID=$!
          sleep 8
          kill -0 $APP_PID
          kill $APP_PID

  windows-host:
    name: Windows host build (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet (sibling)
        uses: actions/checkout@v4
        with:
          repository: turlamai/rivet
          ref: ${{ env.RIVET_PIN }}
          path: rivet
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$env:GITHUB_WORKSPACE\rivet"
      - name: Build + package + verify
        run: raco rivet package
        shell: bash
